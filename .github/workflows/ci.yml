name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Fails CI only on critical vulnerabilities — known moderate/high issues (dev-only
      # esbuild, qs via Express 4) are tracked, not blocking; see ARCHITECTURE.md §9.
      # Combine with GitHub Dependabot alerts (Settings > Security) for ongoing monitoring.
      - run: npm audit --audit-level=critical
